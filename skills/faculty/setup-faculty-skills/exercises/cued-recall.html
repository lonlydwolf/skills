<!--
  cued-recall.html — exercise template, cued-recall shape: a cue, the learner
  produces the term or fact from memory, then reveals. The shape for
  vocabulary and paired facts. Still production — the learner produces the
  answer; never multiple choice (recognition is the weakest retrieval).

  Teachers instantiate this template (copy the .exercise block into a lesson or
  recall page, duplicate the cue card per item, fill the {{...}} slots); never
  invent exercise markup freehand. The zero-stakes firewall applies (defined in
  the course's agent instructions). Stylesheet path is written for a
  page in units/NN-<slug>/lessons/ — adjust if instantiating elsewhere.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{LESSON_TITLE}}</title>
  <link rel="stylesheet" href="../../../assets/theme.css">
</head>
<body>

  <section class="exercise">
    <span class="tag">Recall</span>
    <h3>{{EXERCISE_TITLE}}</h3>

    <p class="muted">Answer each cue from memory before opening it. Mix the order on a second pass.</p>

    <!-- one card per item; duplicate as needed -->
    <details>
      <summary>{{CUE — the prompt side: a definition asking for its term, a term asking for its meaning, one half of a pair}}</summary>
      <p>{{ANSWER}}</p>
    </details>

    <details>
      <summary>{{CUE}}</summary>
      <p>{{ANSWER}}</p>
    </details>

    <details>
      <summary>{{CUE}}</summary>
      <p>{{ANSWER}}</p>
    </details>
  </section>

</body>
</html>
