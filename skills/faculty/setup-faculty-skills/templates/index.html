<!doctype html>
<!--
  index.html — the learner's course hub. Seeded once by /setup-faculty-skills;
  from then on course-owned: teachers update it at session exit, the installer
  never touches it again.

  This is the course's only navigation surface — lesson pages link up to it and
  never sideways to each other — so everything the learner may open must be
  reachable from here. Two jobs, and no third:

    Reachability — the roadmap, and per unit its lessons, its recall page, and
    its deck where the unit has one. A page not linked here is a page the
    learner can only reach by knowing its path.

    Orientation — which unit is current, in the same positional language
    roadmap.html uses (the "now" tag). Position, never achievement.

  Never: counts, progress bars, completion ticks, percentages, or any tally of
  units done. Those turn the folder into a report card and put the learner's own
  course in front of them as a score — the zero-stakes firewall is not only
  about what the roles record. transcript.md is never linked: it carries
  attainment lines.

  Markup comes from the page kit — the shell plus its fragments — which lives
  with the skills rather than in this folder, so improvements arrive without
  re-scaffolding. See assets/conventions.md.
  <main> carries no "numbered" class: these headings are furniture, not steps.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/course.js" defer></script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="page-header">
    <!--
      "Course" is the placeholder, and it is the advisor's to replace: the
      <h1> and the <title> above are set from roadmap.md's own title at the
      first stamp, and kept in step at every later one. The teacher reads a
      single line of roadmap.md and the name is not on it, so a hub still
      reading "Course" after a stamp is the advisor's omission — see
      academic-advisor/SKILL.md, "index.html".
    -->
    <h1>Course</h1>
    <p class="lede">Everything taught so far, and where it is going.</p>
  </header>

  <main id="main">

    <p><a href="roadmap.html">📍 Roadmap</a> — where the journey stands.</p>

    <h2>Units</h2>

    <p class="muted">No units yet — the advisor plans first. Run <code>/academic-advisor</code> to start the mission conversation; taught lessons will appear here.</p>

    <!--
      Replace the empty state with one block per unit, newest last. The current
      unit carries the "now" tag; earlier units carry none — being earlier is
      not a status and needs no word.

      <h3><span class="tag">now</span> Unit 02 — {{UNIT_NAME}}</h3>
      <ul>
        <li><a href="units/02-{{slug}}/lessons/01-{{slug}}.html">Lesson 1 — {{TITLE}}</a>
          <span class="muted">· {{ONE_LINE — what it covers}}</span></li>
        <li><a href="units/02-{{slug}}/lessons/recall.html">Recall</a>
          <span class="muted">· cumulative practice for this unit</span></li>
        <li><a href="units/02-{{slug}}/lessons/deck.html">Deck</a>
          <span class="muted">· the unit's terms — vocabulary units only</span></li>
      </ul>

      The recall link appears only once the page exists: it is written at the
      unit-completion session, and a link to a file that isn't there is worse
      than no link.
    -->

  </main>

</body>
</html>
